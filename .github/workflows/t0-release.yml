name: T0 Release

# t0: the fork's release pipeline. It runs on GitHub-hosted runners and talks to no upstream
# service: no relay, Clerk, npm, Discord, website deploys or tracing. Each platform is packaged by
# upstream's release-desktop.yml; this workflow builds the shared JS bundle once and publishes one
# GitHub release with every installer, the update feed and the `t3` server archives that remote
# (SSH) hosts download. Upstream's own release.yml only runs in pingdotgg/t3code.
#
# Start it by pushing a tag (git tag v0.1.11 && git push origin v0.1.11), or from the Actions tab
# with a version, which tags the selected branch. Builds are unsigned unless the signing secrets
# that release-desktop.yml reads are set.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.11. Tags the selected branch as v<version>."
        required: true
        type: string

concurrency:
  group: t0-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  # The Windows build reads this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - id: meta
        name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$INPUT_VERSION"
          else
            raw="$GITHUB_REF_NAME"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $raw" >&2
            exit 1
          fi
          # Those prerelease names switch the app to upstream's nightly/preview update channels.
          if [[ "$version" =~ -(nightly|preview)\. ]]; then
            echo "::error::$version uses a nightly/preview version, which this workflow does not publish." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "ref=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

  # The platform-independent JS (server bundle, web client, Electron main), built once and handed
  # to every platform job as `js-bundle`.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      # Two paths under apps/ so the artifact root is apps/; consumers download into `apps`.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # macOS runners must have Xcode 26: the Apple Speech helper needs the macOS 26 SDK. x64 builds
  # natively on an Intel runner. It has no CLI archive: Node single executables are unsupported on
  # x64 macOS.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: macos-26-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false

  # AppImage plus deb, rpm and pacman packages, and the Linux CLI archive.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      # The Windows job waits for a job whose name ends in "Build Linux x64".
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  # Packaged on Linux, as upstream does; the native checks run on a Windows runner. It embeds the
  # Linux CLI archive as its WSL runtime.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  release:
    name: Publish GitHub release
    needs: [preflight, desktop_mac_arm64, desktop_mac_x64, desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # The SSH installer verifies archives against this file.
      - name: Write CLI archive checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # electron-updater reads one manifest per platform. macOS has an arm64 and an x64 build to
      # merge; Windows ships x64 only, so its suffixed manifest just gets its plain name back.
      - name: Prepare desktop updater manifests
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f builder-debug.yml
          for manifest in *-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done
          merged=0
          for arm in *-mac.yml; do
            x64="${arm%.yml}-x64.yml"
            if [[ ! -f "$x64" ]]; then
              echo "::error::$arm has no matching x64 manifest ($x64)." >&2
              exit 1
            fi
            node ../scripts/merge-update-manifests.ts --platform mac "$arm" "$x64" "$arm"
            rm "$x64"
            merged=$((merged + 1))
          done
          if [[ "$merged" -eq 0 ]]; then
            echo "::error::No macOS updater manifest was produced." >&2
            exit 1
          fi
          ls -la

      - name: Write release notes header
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          T0 Code is an unofficial, telemetry-free fork of [T3 Code](https://github.com/pingdotgg/t3code).

          | Platform | Download |
          | --- | --- |
          | macOS (Apple silicon) | `T0-Code-*-arm64.dmg` |
          | macOS (Intel) | `T0-Code-*-x64.dmg` |
          | Windows x64 | `T0-Code-*-x64.exe` |
          | Linux: Debian, Ubuntu | `.deb` |
          | Linux: Fedora, RHEL, openSUSE | `.rpm` |
          | Linux: Arch | `.pacman` (`sudo pacman -U <file>`) |
          | Linux: any | `.AppImage` |
          | Server for remote hosts | `t3-*` archives (installed automatically over SSH) |

          These builds are not code-signed. On macOS, if the first launch is blocked, allow it in
          System Settings › Privacy & Security, or run `xattr -dr com.apple.quarantine "/Applications/T0 Code.app"`.
          On Windows, SmartScreen may ask you to confirm with "More info" › "Run anyway".
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: T0 Code v${{ needs.preflight.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pacman
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
